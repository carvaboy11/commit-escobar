name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: instalar dependencias
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: rodar testes
        working-directory: api
        run: pytest -q

  imagens:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: nome da imagem em minusculo
        run: echo "BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLICAR == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: api
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ env.BASE }}/api:latest

      - uses: docker/build-push-action@v6
        with:
          context: cozinha
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ env.BASE }}/cozinha:latest
